<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Us - BloodLink</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    height:100vh;

    background:
    linear-gradient(rgba(200,0,0,0.5),rgba(0,0,0,0.7)),
    url("https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;
    background-position:center;
}

/* CONTAINER */
.container{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100%;
}

.contact-box{
    width:420px;
    background:rgba(255,255,255,0.95);
    padding:30px;
    border-radius:14px;
    box-shadow:0 6px 20px rgba(0,0,0,0.3);
}

/* TITLE */
h2{
    text-align:center;
    color:#d62828;
    margin-bottom:20px;
}

/* INPUT */
input,textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
    outline:none;
}

/* BUTTON */
button{
    width:100%;
    padding:14px;
    background:#d62828;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#b71c1c;
}

/* CONTACT INFO */
.info{
    margin-top:20px;
    text-align:center;
    color:#555;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<div class="contact-box">

<h2>Contact Us</h2>

<form onsubmit="return sendMessage()">

<input type="text" placeholder="Your Name" required>
<input type="email" placeholder="Email Address" required>
<textarea rows="4" placeholder="Your Message" required></textarea>

<button type="submit">Send Message</button>

</form>

<div class="info">
<p>📞 +91 9876543210</p>
<p>📧 bloodlink@gmail.com</p>
<p>📍 Healthcare City</p>
</div>

</div>

</div>

<script>
function sendMessage(){
    alert("Message Sent Successfully!");
    return false;
}
</script>

</body>
</html>
